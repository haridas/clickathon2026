        <path d="M13 10.6 13 3M13 15.4 13 23M10.6 13 3 13M15.4 13 23 13M11.3 11.3 5.8 5.8M14.7 11.3 20.2 5.8M11.3 14.7 5.8 20.2M14.7 14.7 20.2 20.2"
          stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
      </svg>

    </div>

    <button class="active" data-filter="all">All</button>

<script>
let DATA = [];
let currentFilter = "all";

function fmt(n) {
  if (n === null || n === undefined) return "—";
  const abs = Math.abs(n);
  if (abs >= 1000) return n.toLocaleString(undefined, { maximumFractionDigits: 0 });
  if (abs >= 1) return n.toFixed(2);
  return n.toFixed(4);
}

function relTime(iso) {
  const d = new Date(iso);
  const diffH = Math.round((Date.now() - d.getTime()) / 3600000);
  if (diffH < 1) return "just now";
  if (diffH < 24) return `${diffH}h ago`;
  return `${Math.round(diffH / 24)}d ago`;
}

function fmtWindow(startIso, endIso) {
  const s = new Date(startIso), e = new Date(endIso);
  const pad = n => String(n).padStart(2, "0");
  const date = `${s.getUTCFullYear()}-${pad(s.getUTCMonth() + 1)}-${pad(s.getUTCDate())}`;
  const t1 = `${pad(s.getUTCHours())}:${pad(s.getUTCMinutes())}`;
  const t2 = `${pad(e.getUTCHours())}:${pad(e.getUTCMinutes())}`;
  return `${date} ${t1} – ${t2} UTC`;
}

// build_findings() already writes a human-readable detector string, e.g.
// "trailing z-score vs weekday baseline (z=-162.85, trailing 3wk,
// threshold 2.0)" — split off the parenthetical detail for the compact
// meta-line and keep the full string as a hover tooltip.
function detectorLabel(full) {
  const idx = full.indexOf(" (");
  return idx > -1 ? full.slice(0, idx) : full;
}

function friendlyDim(dim) {
  return dim.replace(/_/g, " ");
}

function friendlySeg(dim, seg) {
  if (dim === "os_version" || dim === "device_model") return seg;
  return `${friendlyDim(dim)} "${seg}"`;
}

// How much attention this incident deserves: a business person should be
// able to tell "surely go check this" from "probably noise" without reading
// a word — confidence alone or deviation size alone isn't enough (a huge
// drop the system isn't sure about is NOT a confident finding, and a
// high-confidence 4% wobble isn't worth interrupting anyone for).
function tier(r) {
  const absDev = Math.abs(r.deviation_pct);
  if (r.confidence === "high" && absDev >= 25) return "urgent";
  if (r.confidence === "low" && absDev < 15) return "low";
  return "normal";
}

const TIER_META = {
  urgent: { label: "Confirm and act", order: 0 },
  normal: { label: "Worth a look", order: 1 },
  low: { label: "Low priority — likely noise", order: 2 },
};

function rowTemplate(r) {
  const dir = r.deviation_pct < 0 ? "drop" : "spike";
  // For these ad-metrics (revenue, ecpm, ctr, fill_rate, requests) a rise is
  // good and a fall is bad — the color has to encode business impact, not
  // just arithmetic direction.
  const sentiment = dir === "drop" ? "bad" : "good";
  const arrow = dir === "drop" ? "↓" : "↑";
  const detLabel = detectorLabel(r.detector);
  const rowTier = tier(r);
  const flagged = r.status !== "ok";
  const flagClass = r.status === "failed" ? "bad" : (flagged ? "warn" : "");

  const foundSorted = [...r.found].sort((a, b) => b.contribution_pct - a.contribution_pct);
  const topCause = foundSorted.find(s => s.contribution_pct >= 50);

  // Every claim gets its number attached in the same clause — no hedge words
  // like "mostly"/"probably" standing in for a number we already computed.
  const foundHtml = foundSorted.length ? foundSorted.map(s => `
    <div class="found-item">
      <p class="sentence"><strong>${friendlySeg(s.dimension, s.segment)}</strong>
        accounts for <span class="pct-inline mono">${s.contribution_pct.toFixed(1)}%</span> of the ${dir}
        ${s.contribution_pct >= 50 ? "&mdash; isolated as the cause" : "&mdash; a contributing factor, not the primary cause"}.</p>
      <div class="bar-track"><div class="bar-fill" data-pct="${Math.min(s.contribution_pct,100)}"></div></div>
      <div class="vs">measured <span class="mono">${fmt(s.actual)}</span> against a baseline of <span class="mono">${fmt(s.baseline)}</span></div>
    </div>
  `).join("") : `<div class="ruled-item" style="margin-bottom:22px"><span class="tag">—</span> no segment accounted for a majority of the ${dir}</div>`;

  const ruledHtml = r.ruled_out.length ? r.ruled_out.map(x => `
    <div class="ruled-item">
      <span class="tag">${x.dimension}${x.segment ? "=" + x.segment : ""}</span> ${x.note}
    </div>
  `).join("") : `<div class="ruled-item"><span class="tag">—</span> none recorded</div>`;

  const corrob = r.corroboration
    ? (r.corroboration.corroborated ? "double-checked by a second, independent detector" : "not confirmed by a second detector — treat with caution")
    : "no second detector available to double-check this";

  const statusNote = r.status === "failed"
    ? `<span class="flag-note bad">this run failed partway — numbers below may be incomplete</span>`
    : r.status === "low_confidence"
      ? `<span class="flag-note">flagged low-confidence — a claimed number couldn't be verified</span>`
      : "";

  const costText = r.cost_usd != null ? `$${r.cost_usd.toFixed(4)} to diagnose` : "cost pending";

  // Headline cause clause always carries the number ("accounts for 96.5%"),
  // never a qualitative hedge — the plain-language claim IS the number.
  const causeClause = topCause
    ? `<span class="cause"> &mdash; <strong>${friendlySeg(topCause.dimension, topCause.segment)}</strong> accounts for <span class="mono">${topCause.contribution_pct.toFixed(1)}%</span></span>`
    : `<span class="cause"> &mdash; no single dominant segment isolated</span>`;

  const tagText = rowTier === "urgent"
    ? (sentiment === "bad" ? "Confirm and act" : "Strong result — confirm")
    : rowTier === "low"
      ? "Likely noise"
      : (sentiment === "bad" ? "Worth a look" : "Good news");

  return `
    <div class="row" data-confidence="${r.confidence}" data-dir="${dir}" data-flag="${flagClass}" data-tier="${rowTier}">
      <div class="row-head" tabindex="0" role="button" aria-expanded="false">
        <div class="headline">
          <span class="sev-dot ${sentiment}"></span>
          <span class="headline-text">
            <span class="metric-name">${r.metric.replace("_"," ")}</span>
            ${dir === "drop" ? "dropped" : "spiked"}
            <span class="delta mono ${sentiment}">${arrow} ${Math.abs(r.deviation_pct).toFixed(1)}%</span>
            ${causeClause}
          </span>
          <span class="verdict-tag ${sentiment}">${tagText}</span>
          <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="meta-line mono">
          <span>${relTime(r.created_at)}</span>
          <span class="sep">·</span>
          <span class="conf-word conf-${r.confidence}">${r.confidence} confidence</span>
          <span class="sep">·</span>
          <span class="detector-name" title="${r.detector}">found via ${detLabel}</span>
          ${statusNote ? `<span class="sep">·</span>${statusNote}` : ""}
        </div>
      </div>
      <div class="row-body">
        <p class="section-label">1 · Detected</p>
        <p class="narrative">${r.metric.replace("_"," ")} measured <strong class="mono">${fmt(r.actual)}</strong> against an expected baseline of
          <strong class="mono">${fmt(r.baseline)}</strong> for this window &mdash; a
          <strong class="mono">${Math.abs(r.deviation_pct).toFixed(1)}%</strong> ${dir}, flagged by ${detLabel}.</p>
        <p class="section-label">2 · Drilled down to</p>
        <div class="found-list">${foundHtml}</div>
        <p class="section-label">3 · Diagnosis</p>
        <p class="narrative">${r.narrative}</p>
        <p class="section-label">4 · Checked and ruled out</p>
        <div class="ruled-list">${ruledHtml}</div>
        <div class="footer-row">
          <span class="mono">${fmtWindow(r.window_start, r.window_end)} · ${corrob} · ${costText}</span>
          ${r.trace_url ? `<a href="${r.trace_url}" target="_blank" rel="noopener">trace ↗</a>` : `<span>no trace</span>`}
        </div>
      </div>
    </div>
  `;
}

const feed = document.getElementById("feed");
const empty = document.getElementById("empty");
const countEl = document.getElementById("count");
const perfStrip = document.getElementById("perfStrip");

function renderPerfStrip(rows) {
  const urgentCount = rows.filter(r => tier(r) === "urgent").length;
  const priced = rows.filter(r => r.cost_usd != null);
  const totalCost = priced.reduce((s, r) => s + r.cost_usd, 0);
  const avgCost = priced.length ? totalCost / priced.length : null;
  const totalTokens = rows.reduce(
    (s, r) => s + (r.input_tokens || 0) + (r.output_tokens || 0), 0);

  perfStrip.innerHTML = `
    <div class="perf-tile">
      <span class="label">Incidents</span>
      <span class="value mono">${rows.length}</span>
      <span class="sub">in this view</span>
    </div>
    <div class="perf-tile">
      <span class="label">Confirm and act</span>
      <span class="value mono">${urgentCount}</span>
      <span class="sub">high confidence, large deviation</span>
    </div>
    <div class="perf-tile hero">
      <span class="label">Cost to diagnose</span>
      <span class="value mono">${avgCost != null ? "$" + avgCost.toFixed(4) : "—"}<span class="unit">avg</span></span>
      <span class="sub">${priced.length ? `$${totalCost.toFixed(4)} total · one LLM call each` : "no priced runs yet"}</span>
    </div>
    <div class="perf-tile">
      <span class="label">Tokens processed</span>
      <span class="value mono">${totalTokens.toLocaleString()}</span>
      <span class="sub">Haiku, one call per incident</span>
    </div>
  `;
}

function render(filter) {
  currentFilter = filter;
  const rows = DATA.filter(r => {
    if (filter === "all") return true;
    if (filter === "high") return r.confidence === "high";
    if (filter === "drop") return r.deviation_pct < 0;
    if (filter === "spike") return r.deviation_pct >= 0;
    return true;
  });

  const buckets = { urgent: [], normal: [], low: [] };
  rows.forEach(r => buckets[tier(r)].push(r));

  feed.innerHTML = ["urgent", "normal", "low"].map(t => {
    if (!buckets[t].length) return "";
    const meta = TIER_META[t];
    return `
      <div class="group-header tier-${t}">
        <span class="dot"></span> ${meta.label} <span class="n">(${buckets[t].length})</span>
      </div>
      ${buckets[t].map(rowTemplate).join("")}
    `;
  }).join("");

  empty.style.display = rows.length ? "none" : "block";
  countEl.textContent = `${rows.length} incident${rows.length === 1 ? "" : "s"}`;
  renderPerfStrip(rows);

  feed.querySelectorAll(".bar-fill").forEach(el => {
    const pct = el.getAttribute("data-pct");
    requestAnimationFrame(() => { el.style.width = pct + "%"; });
  });

  feed.querySelectorAll(".row-head").forEach(head => {
    const toggle = () => {
      const row = head.closest(".row");
      const isOpen = row.classList.toggle("open");
      head.setAttribute("aria-expanded", String(isOpen));
    };
    head.addEventListener("click", toggle);
    head.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
    });
  });
}

document.getElementById("toolbar").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  document.querySelectorAll("#toolbar button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  render(btn.dataset.filter);
});

// Flattens the API's nested NarratorRCA (findings.metric, findings.found[],
// ...) into the shape rowTemplate()/tier() already work with — everything
// else in this file only ever sees the flat shape.
function transform(rca) {
  const f = rca.findings;
  return {
    rca_id: rca.rca_id, alert_id: rca.alert_id, created_at: rca.created_at,
    metric: f.metric, window_start: f.window_start, window_end: f.window_end,
    baseline: f.baseline, actual: f.actual, deviation_pct: f.deviation_pct,
    detector: f.detector, found: f.found, ruled_out: f.ruled_out,
    corroboration: f.corroboration,
    narrative: rca.narrative, confidence: rca.confidence, status: rca.status,
    trace_url: rca.trace_url,
    input_tokens: rca.input_tokens, output_tokens: rca.output_tokens,
    cost_usd: rca.cost_usd,
  };
}

async function load() {
  countEl.textContent = "Loading…";
  try {
    const res = await fetch("/narrations?limit=100");
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const raw = await res.json();
    DATA = raw.map(transform);
    render(currentFilter);
  } catch (e) {
    feed.innerHTML = "";
    perfStrip.innerHTML = "";
    empty.textContent = `Couldn't load incidents from /narrations: ${e.message}`;
    empty.style.display = "block";
    countEl.textContent = "—";
  }
}

load();
</script>
